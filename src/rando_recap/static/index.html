<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rando Recap</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1><a href="#">Rando Recap</a></h1>
      <button
        id="config-btn"
        class="config-btn icon"
        title="Settings"
        aria-label="Settings"
      ></button>
    </header>
    <main id="root"></main>

    <footer class="site-footer">
      <a
        href="https://www.strava.com"
        target="_blank"
        rel="noopener external"
        class="strava-attribution"
        aria-label="Powered by Strava"
      >
        <img
          src="/static/vendor/strava/powered-by-strava.svg"
          alt="Powered by Strava"
          height="20"
        />
      </a>
    </footer>

    <dialog id="config-dialog">
      <form id="config-form" method="dialog">
        <div class="dlg-header">
          <h2>Settings</h2>
        </div>
        <div class="dlg-body">
          <div class="field">
            <label for="cfg-min-stop-h">Min stop</label>
            <div class="hms">
              <input id="cfg-min-stop-h" type="number" min="0" step="1" />
              <span class="unit">h</span>
              <input id="cfg-min-stop-m" type="number" min="0" max="59" step="1" />
              <span class="unit">m</span>
              <input id="cfg-min-stop-s" type="number" min="0" max="59" step="1" />
              <span class="unit">s</span>
            </div>
          </div>
          <div class="field">
            <label for="cfg-merge">Merge stops within</label>
            <input id="cfg-merge" type="number" min="0" step="10" />
            <span class="unit">m</span>
          </div>
        </div>
        <div class="dlg-footer">
          <button type="button" id="cfg-cancel" class="btn">Cancel</button>
          <button type="submit" id="cfg-apply" class="btn primary">Apply</button>
        </div>
      </form>
    </dialog>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/static/app.js"></script>
  </body>
</html>
