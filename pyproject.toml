[project]
name = "rando-recap"
version = "0.1.0"
description = "Randonneuring ride analysis from Strava activity streams"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "naokton", email = "march.of.rabbits@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "astral>=3.2",
    "click>=8.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
app = "rando_recap.cli:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=0.62.0",
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# default ["E4", "E7", "E9", "F"]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF", "TC", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
